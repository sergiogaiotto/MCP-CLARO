# Migracoes do banco do vigia (segunda maquina), separadas das do gateway.
# A conexao vem dos parametros do papel vigia (DATABASE_URL + DATABASE_PASSWORD_FILE),
# com o usuario dono do banco do vigia (mcp_claro_vigia_migracao).
#   mcp-claro migrar-vigia
[alembic]
script_location = %(here)s/migrations_vigia
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
