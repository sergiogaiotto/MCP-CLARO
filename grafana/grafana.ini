# Grafana do MCP-CLARO (grafana/grafana:13.3.1, fixada por digest).
#
# - Fica so na rede interna: nao sai para a internet. Por isso tudo o que chamaria grafana.com ou
#   outro servico de fora fica desligado (atualizacoes, estatisticas, noticias, plugins, instantaneos).
# - Banco proprio "grafana" no PostgreSQL do produto, usuario "grafana", com TLS (verify-full).
# - Fonte de dados, paineis e alertas vem de arquivos versionados (grafana/provisionamento e
#   grafana/paineis). Nada e editado pela tela.
# - Senhas por segredo do Docker ($__file{...}); o endereco do banco por $__env{...}.
# Variaveis GF_<SECAO>_<CHAVE> no ambiente sobrepoem este arquivo (o teste usa isso para http e
# banco sem TLS).

[paths]
provisioning = /etc/grafana/provisioning

[server]
protocol = https
http_port = 3000
cert_file = /run/secrets/grafana_cert.pem
cert_key = /run/secrets/grafana_key.pem
enable_gzip = true
router_logging = false

[database]
type = postgres
host = $__env{MCP_CLARO_BANCO_ENDERECO}
name = grafana
user = grafana
password = $__file{/run/secrets/db_grafana}
ssl_mode = verify-full
ca_cert_path = /run/secrets/ca_interna.pem
server_cert_name = banco
# Uma instancia so.
high_availability = false

[security]
admin_user = admin
admin_password = $__file{/run/secrets/grafana_admin}
disable_gravatar = true
cookie_secure = true
cookie_samesite = strict
allow_embedding = false
content_security_policy = true
x_xss_protection = false

[users]
allow_sign_up = false
allow_org_create = false
default_language = pt-BR
viewers_can_edit = false

[auth.anonymous]
enabled = false

[analytics]
# Sem envio de estatisticas e sem checagem de versao do Grafana ou dos plugins.
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[plugins]
# Nada se atualiza sozinho: sem instalacao pela tela, sem pre-instalacao e sem atualizacao automatica.
plugin_admin_enabled = false
preinstall_disabled = true
preinstall_auto_update = false
public_key_retrieval_disabled = true

[news]
news_feed_enabled = false

[snapshots]
enabled = false
external_enabled = false

[public_dashboards]
enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana/paineis/visao-geral.json

[date_formats]
default_timezone = browser

[unified_alerting]
enabled = true

[unified_alerting.screenshots]
capture = false

[log]
mode = console
level = info
