# MCP-CLARO: ambiente de desenvolvimento e teste.
# Antes de subir: scripts/gerar-segredos-dev.sh (segredos SO de teste, em .segredos/).
#   docker compose -f docker/compose.yml up --build
# Redes: borda (sai para a internet), interna (sem saida), saida (so quem chama para fora), visitas (so o
# despachante e a sala de visitas, sem saida) e saida_visitas (so a sala, para os servidores de terceiros).
# A imagem do gateway pode vir pronta: MCP_CLARO_IMAGEM=<nome:etiqueta> (padrao mcp-claro:dev, construida aqui).
name: mcp-claro

x-gateway: &gateway
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: ${MCP_CLARO_IMAGEM:-mcp-claro:dev}
  read_only: true
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging:
    driver: local
  environment: &ambiente
    APP_ENV: teste
    PUBLIC_BASE_URL: https://mcp-claro.localhost
    DATABASE_URL: postgresql://mcp_claro_entrada@banco:5432/mcp_claro
    DB_SSLMODE: verify-full
    DB_SSLROOTCERT: /run/secrets/ca_interna.pem
    INTERNAL_CA_FILE: /run/secrets/ca_interna.pem
    IDP_KIND: keycloak
    IDP_ISSUER_URL: https://mcp-claro.localhost/login/realms/mcp-claro
    # A entrada busca a lista JWKS pela rede interna, sem passar pelo portao.
    IDP_JWKS_URL: http://login:8080/login/realms/mcp-claro/protocol/openid-connect/certs
    DISPATCHER_INTERNAL_URL: https://despachante:9443
    # Sala de visitas (Fase 3): so o despachante fala com ela; fora de desenvolvimento e teste, e obrigatoria.
    VISITS_INTERNAL_URL: https://visitas:9446
    VAULT_ADDR: https://cofre:8200
    VAULT_SEAL_MODE: static
    # Avisos ao ADMIN: as rotinas (fichas, programas, ronda) e o despachante (cofre trancado fecha a saida).
    NOTIFY_ADMIN_EMAILS: admin@mcp-claro.localhost
  depends_on:
    migrar:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "python", "-m", "mcp_claro.saude"]
    interval: 10s
    timeout: 5s
    retries: 12
  networks: [interna]

services:
  banco:
    build: ./postgres
    image: mcp-claro-postgres:dev
    restart: unless-stopped
    # Um init como PID 1: o servidor do pgBackRest roda ao lado do PostgreSQL no mesmo conteiner.
    init: true
    environment:
      PGBACKREST_LIGADO: ligado
      PGBACKREST_STANZA: mcp-claro
      POSTGRES_USER: mcp_claro_migracao
      POSTGRES_DB: mcp_claro
      POSTGRES_PASSWORD_FILE: /run/secrets/db_migracao
    secrets:
      [db_migracao, db_entrada, db_despachante, db_rotinas, db_grafana_leitor, db_cofre, db_login, db_grafana,
       banco_cert.pem, banco_key.pem, ca_interna.pem, db_backup]
    volumes: ["banco:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_claro_migracao -d mcp_claro -h 127.0.0.1"]
      interval: 5s
      retries: 20
    logging:
      driver: local
    networks: [interna]

  migrar:
    <<: *gateway
    restart: "no"
    command: ["migrar"]
    healthcheck:
      disable: true
    environment:
      <<: *ambiente
      DATABASE_URL: postgresql://mcp_claro_migracao@banco:5432/mcp_claro
      DATABASE_PASSWORD_FILE: /run/secrets/db_migracao
    secrets: [db_migracao, ca_interna.pem]
    depends_on:
      banco:
        condition: service_healthy

  entrada:
    <<: *gateway
    command: ["entrada"]
    environment:
      <<: *ambiente
      DATABASE_PASSWORD_FILE: /run/secrets/db_entrada
      INTERNAL_CERT_FILE: /run/secrets/entrada_cert.pem
      INTERNAL_KEY_FILE: /run/secrets/entrada_key.pem
      # A porta da entrada aceita so o certificado do portao proprio.
      INTERNAL_CLIENT_CA_FILE: /run/secrets/ca_clientes_entrada.pem
      # Certificado para chamar o despachante.
      INTERNAL_CLIENT_CERT_FILE: /run/secrets/entrada_cliente_cert.pem
      INTERNAL_CLIENT_KEY_FILE: /run/secrets/entrada_cliente_key.pem
      INTERNAL_HEALTH_CERT_FILE: /run/secrets/entrada_saude_cert.pem
      INTERNAL_HEALTH_KEY_FILE: /run/secrets/entrada_saude_key.pem
      VAULT_ROLE_ID_FILE: /run/secrets/cofre_entrada_role_id
      VAULT_SECRET_ID_FILE: /run/secrets/cofre_entrada_secret_id
      # Telas: login das pessoas pelo cliente confidencial; a troca do codigo vai pela rede interna.
      SCREENS_CLIENT_ID: mcp-claro-telas
      SCREENS_CLIENT_SECRET_FILE: /run/secrets/telas_cliente
      SCREENS_IDP_TOKEN_URL: http://login:8080/login/realms/mcp-claro/protocol/openid-connect/token
    secrets: [telas_cliente, db_entrada, ca_interna.pem, entrada_cert.pem, entrada_key.pem, ca_clientes_entrada.pem,
              entrada_cliente_cert.pem, entrada_cliente_key.pem, entrada_saude_cert.pem, entrada_saude_key.pem,
              cofre_entrada_role_id, cofre_entrada_secret_id]
    depends_on:
      migrar:
        condition: service_completed_successfully
      cofre-iniciar:
        condition: service_completed_successfully
      login:
        condition: service_healthy

  despachante:
    <<: *gateway
    command: ["despachante"]
    environment:
      <<: *ambiente
      DATABASE_URL: postgresql://mcp_claro_despachante@banco:5432/mcp_claro
      DATABASE_PASSWORD_FILE: /run/secrets/db_despachante
      INTERNAL_CERT_FILE: /run/secrets/despachante_cert.pem
      INTERNAL_KEY_FILE: /run/secrets/despachante_key.pem
      # A porta do despachante aceita so a entrada e as rotinas.
      INTERNAL_CLIENT_CA_FILE: /run/secrets/ca_clientes_despachante.pem
      INTERNAL_HEALTH_CERT_FILE: /run/secrets/despachante_saude_cert.pem
      INTERNAL_HEALTH_KEY_FILE: /run/secrets/despachante_saude_key.pem
      VAULT_ROLE_ID_FILE: /run/secrets/cofre_despachante_role_id
      VAULT_SECRET_ID_FILE: /run/secrets/cofre_despachante_secret_id
      # mTLS com a sala de visitas: confia so na ca_visitas e leva o certificado da ca_clientes_visitas.
      VISITS_CA_FILE: /run/secrets/ca_visitas.pem
      VISITS_CLIENT_CERT_FILE: /run/secrets/despachante_visitas_cliente_cert.pem
      VISITS_CLIENT_KEY_FILE: /run/secrets/despachante_visitas_cliente_key.pem
    secrets: [db_despachante, ca_interna.pem, despachante_cert.pem, despachante_key.pem, ca_clientes_despachante.pem,
              despachante_saude_cert.pem, despachante_saude_key.pem, cofre_despachante_role_id,
              cofre_despachante_secret_id, ca_visitas.pem, despachante_visitas_cliente_cert.pem,
              despachante_visitas_cliente_key.pem]
    depends_on:
      migrar:
        condition: service_completed_successfully
      cofre-iniciar:
        condition: service_completed_successfully
    # interna: banco, cofre e quem o chama. saida: sistemas proprios e a troca de chave (OAuth) dos terceiros.
    # visitas: a sala de visitas, que fala com os servidores de terceiros.
    networks: [interna, saida, visitas]

  visitas:
    # Sala de visitas (Fase 3; ajustes D1, A1 e M4): fala com os servidores de terceiros, cada chamada num processo
    # filho novo. Sem banco, sem cofre e sem extrato: nenhum segredo alem do proprio certificado (a partida recusa
    # DATABASE_*, DB_*, VAULT_* e outros *_FILE). A porta 9446 so aceita o certificado de cliente do despachante.
    # A rede e a do visitas-muro: so o despachante (rede visitas) e enderecos publicos (rede saida_visitas).
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${MCP_CLARO_IMAGEM:-mcp-claro:dev}
    command: ["visitas"]
    read_only: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp"]
    environment:
      APP_ENV: teste
      VISITS_INTERNAL_PORT: "9446"
      # Certificado de servidor da ca_visitas (so serverAuth) e, como autoridade de clientes, a ca_clientes_visitas.
      # INTERNAL_CA_FILE e a ca_visitas: so a conferencia de saude a usa.
      INTERNAL_CA_FILE: /run/secrets/ca_visitas.pem
      INTERNAL_CERT_FILE: /run/secrets/visitas_cert.pem
      INTERNAL_KEY_FILE: /run/secrets/visitas_key.pem
      INTERNAL_CLIENT_CA_FILE: /run/secrets/ca_clientes_visitas.pem
    secrets: [ca_visitas.pem, visitas_cert.pem, visitas_key.pem, ca_clientes_visitas.pem]
    healthcheck:
      test: ["CMD", "python", "-m", "mcp_claro.visitas.saude"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      visitas-muro:
        condition: service_healthy
    network_mode: "service:visitas-muro"
    logging:
      driver: local

  visitas-muro:
    # Dono da rede da sala de visitas (a sala usa network_mode: service:visitas-muro, e o nome visitas aponta para
    # ca). Na partida, tira da tabela de rotas todo destino que nao e publico: link-local (169.254.0.0/16, onde fica o
    # servico de metadados das nuvens), redes privadas, CGNAT, reservadas e multicast, a propria rede saida_visitas
    # (o host e os vizinhos) e o lado do host da rede visitas. Ficam o despachante (rede visitas) e a saida para
    # enderecos publicos. As redes da sala nao tem IPv6. So este conteiner tem NET_ADMIN, e depois ele so dorme;
    # a sala nao tem capacidade nenhuma e nao muda as rotas.
    image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    init: true
    read_only: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_ADMIN"]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        falhar() { echo "visitas-muro: $$*" >&2; exit 1; }
        gw=$$(ip route | awk '$$1=="default" {print $$3; exit}')
        dev=$$(ip route | awk '$$1=="default" {print $$5; exit}')
        [ -n "$$gw" ] && [ -n "$$dev" ] || falhar "sem rota de saida (rede saida_visitas)"
        saida=$$(ip route | awk -v d="$$dev" '$$1!="default" && $$2=="dev" && $$3==d {print $$1; exit}')
        visitas=$$(ip route | awk -v d="$$dev" '$$1!="default" && $$2=="dev" && $$3!=d {print $$1; exit}')
        [ -n "$$saida" ] && [ -n "$$visitas" ] || falhar "faltam as redes visitas e saida_visitas"
        rede=$$(ipcalc -n "$$visitas" | sed 's/^NETWORK=//')
        host_visitas="$${rede%.*}.$$(( $${rede##*.} + 1 ))"
        for destino in 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 \
          192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 \
          "$$saida" "$$host_visitas/32"; do
          ip route replace unreachable "$$destino"
        done
        ip route replace default via "$$gw" dev "$$dev" onlink
        echo "visitas-muro: so o despachante ($$visitas) e enderecos publicos"
        trap 'exit 0' TERM INT
        while :; do sleep 3600 & wait $$!; done
    healthcheck:
      test: ["CMD-SHELL", "ip route | grep -q '^unreachable 169.254.0.0/16' && ip route | grep -q '^default .* onlink'"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      visitas:
        aliases: [visitas]
      saida_visitas: {}
    logging:
      driver: local

  rotinas:
    <<: *gateway
    command: ["rotinas"]
    environment:
      <<: *ambiente
      DATABASE_URL: postgresql://mcp_claro_rotinas@banco:5432/mcp_claro
      DATABASE_PASSWORD_FILE: /run/secrets/db_rotinas
      INTERNAL_CERT_FILE: /run/secrets/rotinas_cert.pem
      INTERNAL_KEY_FILE: /run/secrets/rotinas_key.pem
      SMTP_HOST: correio
      SMTP_PORT: "1025"
      SMTP_FROM: mcp-claro@mcp-claro.localhost
      SMTP_STARTTLS: desligado
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_assinatura
      GRAFANA_WEBHOOK_PASSWORD_FILE: /run/secrets/grafana_webhook
      # A porta das rotinas aceita so o Grafana (alertas por webhook interno).
      INTERNAL_CLIENT_CA_FILE: /run/secrets/ca_clientes_rotinas.pem
      INTERNAL_CLIENT_CERT_FILE: /run/secrets/rotinas_cliente_cert.pem
      INTERNAL_CLIENT_KEY_FILE: /run/secrets/rotinas_cliente_key.pem
      INTERNAL_HEALTH_CERT_FILE: /run/secrets/rotinas_saude_cert.pem
      INTERNAL_HEALTH_KEY_FILE: /run/secrets/rotinas_saude_key.pem
      VAULT_ROLE_ID_FILE: /run/secrets/cofre_rotinas_role_id
      VAULT_SECRET_ID_FILE: /run/secrets/cofre_rotinas_secret_id
    secrets: [db_rotinas, ca_interna.pem, rotinas_cert.pem, rotinas_key.pem, ca_clientes_rotinas.pem,
              rotinas_cliente_cert.pem, rotinas_cliente_key.pem, rotinas_saude_cert.pem, rotinas_saude_key.pem,
              cofre_rotinas_role_id, cofre_rotinas_secret_id, webhook_assinatura, grafana_webhook]
    depends_on:
      migrar:
        condition: service_completed_successfully
      cofre-iniciar:
        condition: service_completed_successfully
      despachante:
        condition: service_healthy
      correio:
        condition: service_started
    networks: [interna, saida]

  cofre:
    # OpenBao: so as chaves de cifra (Transit) e a chave do estado das confirmacoes (KV v2), sobre o PostgreSQL.
    # Selo static nos testes (decisao 6): destrava sozinho com o segredo cofre_selo.key. Porta 8200 com mTLS.
    # Na primeira subida, o servico cofre-iniciar inicia o cofre e cria os AppRoles.
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    entrypoint: ["/usr/bin/dumb-init", "/bin/sh", "/openbao/mcp-claro/partida.sh"]
    read_only: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp"]
    volumes: ["./cofre:/openbao/mcp-claro:ro"]
    secrets: [db_cofre, cofre_selo.key, cofre_cert.pem, cofre_key.pem, ca_interna.pem]
    depends_on:
      banco:
        condition: service_healthy
    healthcheck:
      # 0 so quando iniciado e destravado; 2 quando trancado ou ainda nao iniciado.
      test: ["CMD", "bao", "status", "-address=https://127.0.0.1:8200", "-ca-cert=/run/secrets/ca_interna.pem",
             "-client-cert=/run/secrets/cofre_cert.pem", "-client-key=/run/secrets/cofre_key.pem"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: local
    networks: [interna]

  cofre-iniciar:
    # Uma vez, so desenvolvimento e teste: inicia o cofre, liga Transit e KV v2, grava as politicas, cria os
    # AppRoles entrada, despachante e rotinas e grava role_id/secret_id em .segredos/. Idempotente.
    # Roda como root so para gravar em .segredos/ com o dono da pasta.
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    entrypoint: ["/bin/sh", "/iniciar/iniciar-cofre.sh"]
    user: "0:0"
    read_only: true
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    tmpfs: ["/tmp"]
    environment:
      BAO_ADDR: https://cofre:8200
      BAO_CACERT: /run/secrets/ca_interna.pem
      BAO_CLIENT_CERT: /run/secrets/cofre_cert.pem
      BAO_CLIENT_KEY: /run/secrets/cofre_key.pem
      COFRE_SEGREDOS: /segredos
      COFRE_POLITICAS: /iniciar/politicas
    volumes:
      - ../scripts/iniciar-cofre.sh:/iniciar/iniciar-cofre.sh:ro
      - ./cofre/politicas:/iniciar/politicas:ro
      - ../.segredos:/segredos
    secrets: [ca_interna.pem, cofre_cert.pem, cofre_key.pem]
    depends_on:
      cofre:
        condition: service_started
    logging:
      driver: local
    networks: [interna]

  login:
    image: keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # O Keycloak nao le senha de arquivo (_FILE): o envelope le os segredos e chama o kc.sh.
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        KC_DB_PASSWORD="$$(< /run/secrets/db_login)"
        KC_BOOTSTRAP_ADMIN_PASSWORD="$$(< /run/secrets/login_admin)"
        MCP_CLARO_TELAS_SEGREDO="$$(< /run/secrets/telas_cliente)"
        export KC_DB_PASSWORD KC_BOOTSTRAP_ADMIN_PASSWORD MCP_CLARO_TELAS_SEGREDO
        exec /opt/keycloak/bin/kc.sh "$$@"
      - kc
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: https://mcp-claro.localhost/login
      KC_HTTP_RELATIVE_PATH: /login
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_DB: postgres
      KC_DB_URL_HOST: banco
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: login
      KC_DB_URL_PROPERTIES: "?sslmode=verify-full&sslrootcert=/run/secrets/ca_interna.pem"
      KC_DB_USERNAME: login
      KC_BOOTSTRAP_ADMIN_USERNAME: admin-login
      # Audiencia dos crachas: PUBLIC_BASE_URL + /mcp (MCP_RESOURCE_ID do gateway).
      MCP_CLARO_RECURSO: https://mcp-claro.localhost/mcp
      MCP_CLARO_CLIENTES_DE_TESTE: "false"
    secrets: [db_login, login_admin, telas_cliente, ca_interna.pem]
    volumes:
      - ./login/realm-mcp-claro.json:/opt/keycloak/data/import/realm-mcp-claro.json:ro
    depends_on:
      banco:
        condition: service_healthy
    healthcheck:
      # Porta de gerencia (9000), que nao passa pelo portao. A imagem nao tem curl.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r linha <&3 && [[ "$$linha" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    logging:
      driver: local
    networks: [borda, interna]

  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      MCP_CLARO_BANCO_ENDERECO: banco:5432
      MCP_CLARO_BANCO_NOME: mcp_claro
      MCP_CLARO_BANCO_SSLMODE: verify-full
      MCP_CLARO_ALERTAS_URL: https://rotinas:9444/interno/alertas-grafana
      GF_SERVER_DOMAIN: mcp-claro.localhost
      GF_SERVER_ROOT_URL: https://mcp-claro.localhost/paineis/
    volumes:
      - ../grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ../grafana/provisionamento:/etc/grafana/provisioning:ro
      - ../grafana/paineis:/etc/grafana/paineis:ro
      - grafana_dados:/var/lib/grafana
    secrets:
      - db_grafana
      - db_grafana_leitor
      - grafana_admin
      - grafana_webhook
      - ca_interna.pem
      - grafana_cert.pem
      - grafana_key.pem
      - grafana_cliente_cert.pem
      - grafana_cliente_key.pem
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--cacert", "/run/secrets/ca_interna.pem",
             "https://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      banco:
        condition: service_healthy
      migrar:
        condition: service_completed_successfully
    logging:
      driver: local
    networks: [interna]

  backup:
    build: ./backup
    image: mcp-claro-backup:dev
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      PGBACKREST_STANZA: mcp-claro
      BACKUP_COMPLETA_DIA_SEMANA: "7"
      BACKUP_HORA: "3"
      BACKUP_INCREMENTAL_HORAS: "1"
      BACKUP_LOGICO_HORA: "4"
      BACKUP_VERIFICAR_DIA_SEMANA: "6"
      BACKUP_SAUDE_HORAS: "26"
      LOGICO_BANCOS: mcp_claro grafana cofre login
      LOGICO_GUARDA_DIAS: "35"
      LOGICO_ENVIO: local
    secrets:
      - backup_cifra
      - db_backup
      - backup_cert.pem
      - backup_key.pem
      - ca_interna.pem
    volumes:
      - backup_repositorio:/var/lib/pgbackrest
      - backup_local:/var/lib/mcp-claro-backup
    healthcheck:
      test: ["CMD", "/usr/local/bin/backup.sh", "saude"]
      interval: 5m
      timeout: 60s
      retries: 3
      start_period: 2h
    depends_on:
      banco:
        condition: service_healthy
    logging:
      driver: local
    # interna: banco. saida: repositorio S3 ou SFTP fora das maquinas (piloto e producao).
    networks: [interna, saida]

  # So no roteiro de restauracao (docs/restauracao.md), nunca sobe sozinho:
  #   docker compose ... --profile restauracao run --rm restaurar-logico /var/lib/mcp-claro-backup/logico/<carimbo>
  # Usa o dono do servidor (db_migracao) e a senha da cifra (backup_cifra), que voltam do lugar seguro.
  restaurar-logico:
    image: mcp-claro-backup:dev
    profiles: ["restauracao"]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    entrypoint: ["/usr/local/bin/restaurar-logico.sh"]
    secrets:
      - backup_cifra
      - db_migracao
      - ca_interna.pem
    volumes:
      - backup_local:/var/lib/mcp-claro-backup:ro
    logging:
      driver: local
    networks: [interna]

  portao:
    build: ./caddy
    image: mcp-claro-portao:dev
    restart: unless-stopped
    environment:
      PUBLIC_HOST: mcp-claro.localhost
      GATEWAY_INTERNAL_PORT: "8443"
      EDGE_RATE_PER_IP_PER_MINUTE: "120"
    secrets: [portao_cliente_cert.pem, portao_cliente_key.pem, ca_interna.pem]
    ports: ["443:443"]
    volumes: ["portao_dados:/data"]
    depends_on: [entrada, login]
    logging:
      driver: local
    networks: [borda, interna]

  correio:
    # Mailpit: recebe os avisos nos testes. So desenvolvimento.
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports: ["127.0.0.1:8025:8025"]
    networks: [saida]

networks:
  borda: {}
  interna:
    internal: true
  saida: {}
  # So o despachante e a sala de visitas; sem saida.
  visitas:
    internal: true
  # So a sala de visitas, para os servidores de terceiros (a rota fica so para enderecos publicos: visitas-muro).
  saida_visitas: {}

volumes:
  banco: {}
  portao_dados: {}
