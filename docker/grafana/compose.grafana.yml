# MCP-CLARO, Fase 1: fragmento do Grafana (paineis e alertas de tendencia).
# Use junto com o arquivo principal; os caminhos relativos valem a partir de docker/:
#   docker compose -f docker/compose.yml -f docker/grafana/compose.grafana.yml up --build
#
# - Imagem grafana/grafana:13.3.1 fixada por digest. Nada se atualiza sozinho (grafana/grafana.ini).
# - So na rede interna: o Grafana nao sai para a internet.
# - Banco proprio "grafana" (usuario grafana, segredo db_grafana), criado por docker/postgres/iniciar.
# - Fonte de dados com grafana_leitor (segredo db_grafana_leitor), so SELECT nas visoes de medicoes.
# - Paineis, fonte de dados e alertas vem de arquivos versionados: grafana/paineis e grafana/provisionamento.
# - Alertas: webhook interno as rotinas (POST https://rotinas:9444/interno/alertas-grafana), com
#   autenticacao basica (segredo grafana_webhook) e certificado de cliente grafana_cliente (mTLS).
# - Acesso pelas pessoas: pelo portao, em https://mcp-claro.localhost/paineis/ (rota a ligar no Caddyfile:
#   handle_path /paineis/* com reverse_proxy https://grafana:3000, confiando na ca_interna).
services:
  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      MCP_CLARO_BANCO_ENDERECO: banco:5432
      MCP_CLARO_BANCO_NOME: mcp_claro
      MCP_CLARO_BANCO_SSLMODE: verify-full
      MCP_CLARO_ALERTAS_URL: https://rotinas:9444/interno/alertas-grafana
      GF_SERVER_DOMAIN: mcp-claro.localhost
      GF_SERVER_ROOT_URL: https://mcp-claro.localhost/paineis/
    volumes:
      - ../grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ../grafana/provisionamento:/etc/grafana/provisioning:ro
      - ../grafana/paineis:/etc/grafana/paineis:ro
      - grafana_dados:/var/lib/grafana
    secrets:
      - db_grafana
      - db_grafana_leitor
      - grafana_admin
      - grafana_webhook
      - ca_interna.pem
      - grafana_cert.pem
      - grafana_key.pem
      - grafana_cliente_cert.pem
      - grafana_cliente_key.pem
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--cacert", "/run/secrets/ca_interna.pem",
             "https://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      banco:
        condition: service_healthy
      migrar:
        condition: service_completed_successfully
    logging:
      driver: local
    networks: [interna]

volumes:
  grafana_dados: {}

secrets:
  grafana_admin: { file: ../.segredos/grafana_admin }
  grafana_cert.pem: { file: ../.segredos/grafana_cert.pem }
  grafana_key.pem: { file: ../.segredos/grafana_key.pem }
  grafana_cliente_cert.pem: { file: ../.segredos/grafana_cliente_cert.pem }
  grafana_cliente_key.pem: { file: ../.segredos/grafana_cliente_key.pem }
