# pgBackRest 2.60.1 no conteiner de backup do MCP-CLARO (o "repository host").
#
# - Repositorio cifrado (aes-256-cbc). A senha da cifra vem do segredo backup_cifra, pela variavel
#   PGBACKREST_REPO1_CIPHER_PASS (backup.sh); nunca fica neste arquivo nem no banco.
# - Desenvolvimento: o repositorio e um volume separado (/var/lib/pgbackrest). Piloto e producao: o
#   repositorio fica FORA das duas maquinas, num servico S3 compativel ou num servidor SFTP, que nao sao
#   pecas do produto. Troque pelo ambiente, sem mudar este arquivo (docs/restauracao.md):
#     S3:   PGBACKREST_REPO1_TYPE=s3, PGBACKREST_REPO1_S3_BUCKET, PGBACKREST_REPO1_S3_ENDPOINT,
#           PGBACKREST_REPO1_S3_REGION, PGBACKREST_REPO1_S3_URI_STYLE=path, PGBACKREST_REPO1_PATH=/mcp-claro,
#           e as chaves pelos segredos backup_s3_chave e backup_s3_segredo.
#     SFTP: PGBACKREST_REPO1_TYPE=sftp, PGBACKREST_REPO1_SFTP_HOST, PGBACKREST_REPO1_SFTP_HOST_USER,
#           PGBACKREST_REPO1_SFTP_HOST_KEY_HASH_TYPE=sha256, PGBACKREST_REPO1_SFTP_HOST_FINGERPRINT,
#           PGBACKREST_REPO1_SFTP_PRIVATE_KEY_FILE=/run/secrets/backup_sftp_chave, PGBACKREST_REPO1_PATH.
# - Servidor TLS (porta 8432): o banco manda cada WAL por ele (archive-push). So aceita o certificado de
#   cliente "banco" (tls-server-auth). Para chegar ao banco, usa o servidor TLS do pgBackRest de la.
# - Copias: completa, diferencial e incremental, agendadas por backup.sh; guarda pelas opcoes repo1-retention.

[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=count
repo1-retention-full=4
repo1-retention-diff=7
repo1-bundle=y
repo1-block=y

compress-type=zst
process-max=2
start-fast=y
archive-check=y
archive-timeout=120

log-level-console=info
log-level-stderr=warn
log-level-file=off
lock-path=/tmp/pgbackrest

tls-server-address=*
tls-server-port=8432
tls-server-ca-file=/tmp/pgbackrest-tls/ca.pem
tls-server-cert-file=/tmp/pgbackrest-tls/cert.pem
tls-server-key-file=/tmp/pgbackrest-tls/key.pem
tls-server-auth=banco=mcp-claro

[mcp-claro]
pg1-host=banco
pg1-host-type=tls
pg1-host-port=8432
pg1-host-ca-file=/tmp/pgbackrest-tls/ca.pem
pg1-host-cert-file=/tmp/pgbackrest-tls/cert.pem
pg1-host-key-file=/tmp/pgbackrest-tls/key.pem
pg1-path=/var/lib/postgresql/18/docker
pg1-port=5432
pg1-socket-path=/var/run/postgresql
pg1-user=mcp_claro_migracao
