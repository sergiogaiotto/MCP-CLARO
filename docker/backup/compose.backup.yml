# MCP-CLARO, Fase 1: fragmento do backup (pgBackRest 2.60.1 e copia logica com pg_dump).
# Use junto com o arquivo principal; os caminhos relativos valem a partir de docker/:
#   docker compose -f docker/compose.yml -f docker/backup/compose.backup.yml up --build
#
# - O banco liga o archive_command (cada WAL vai ao backup) e o servidor TLS do pgBackRest (porta 8432).
# - O conteiner "backup" guarda o repositorio cifrado e agenda as copias: completa por semana,
#   diferencial por dia, incremental por hora e uma copia logica (pg_dump) por dia (backup.sh).
# - Banco e backup se falam pelo TLS do pgBackRest, com certificado dos dois lados (banco_cert e
#   backup_cert, da autoridade interna).
# - Desenvolvimento: o repositorio e o volume separado "backup_repositorio". Piloto e producao: o
#   repositorio fica FORA das duas maquinas (S3 compativel ou SFTP, pecas fora do produto), pelas
#   variaveis PGBACKREST_REPO1_* e LOGICO_ENVIO=s3|sftp (docker/backup/pgbackrest.conf e
#   docs/restauracao.md). A senha da cifra (segredo backup_cifra) nunca vai junto do repositorio.
# - Segredos novos: backup_cifra (senha da cifra do repositorio e da copia logica) e db_backup (senha do
#   usuario mcp_claro_backup, so leitura, que faz o pg_dump).
services:
  banco:
    # Um init como PID 1: o servidor do pgBackRest roda ao lado do PostgreSQL no mesmo conteiner.
    init: true
    environment:
      PGBACKREST_LIGADO: ligado
      PGBACKREST_STANZA: mcp-claro
    secrets:
      - db_backup

  backup:
    build: ./backup
    image: mcp-claro-backup:dev
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      PGBACKREST_STANZA: mcp-claro
      BACKUP_COMPLETA_DIA_SEMANA: "7"
      BACKUP_HORA: "3"
      BACKUP_INCREMENTAL_HORAS: "1"
      BACKUP_LOGICO_HORA: "4"
      BACKUP_VERIFICAR_DIA_SEMANA: "6"
      BACKUP_SAUDE_HORAS: "26"
      LOGICO_BANCOS: mcp_claro grafana cofre login
      LOGICO_GUARDA_DIAS: "35"
      LOGICO_ENVIO: local
    secrets:
      - backup_cifra
      - db_backup
      - backup_cert.pem
      - backup_key.pem
      - ca_interna.pem
    volumes:
      - backup_repositorio:/var/lib/pgbackrest
      - backup_local:/var/lib/mcp-claro-backup
    healthcheck:
      test: ["CMD", "/usr/local/bin/backup.sh", "saude"]
      interval: 5m
      timeout: 60s
      retries: 3
      start_period: 2h
    depends_on:
      banco:
        condition: service_healthy
    logging:
      driver: local
    # interna: banco. saida: repositorio S3 ou SFTP fora das maquinas (piloto e producao).
    networks: [interna, saida]

  # So no roteiro de restauracao (docs/restauracao.md), nunca sobe sozinho:
  #   docker compose ... --profile restauracao run --rm restaurar-logico /var/lib/mcp-claro-backup/logico/<carimbo>
  # Usa o dono do servidor (db_migracao) e a senha da cifra (backup_cifra), que voltam do lugar seguro.
  restaurar-logico:
    image: mcp-claro-backup:dev
    profiles: ["restauracao"]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    entrypoint: ["/usr/local/bin/restaurar-logico.sh"]
    secrets:
      - backup_cifra
      - db_migracao
      - ca_interna.pem
    volumes:
      - backup_local:/var/lib/mcp-claro-backup:ro
    logging:
      driver: local
    networks: [interna]

volumes:
  backup_repositorio: {}
  backup_local: {}

secrets:
  backup_cifra: { file: ../.segredos/backup_cifra }
  db_backup: { file: ../.segredos/db_backup }
  backup_cert.pem: { file: ../.segredos/backup_cert.pem }
  backup_key.pem: { file: ../.segredos/backup_key.pem }
