# MCP-CLARO, Fase 1: fragmento do papel rotinas (tarefas periodicas, avisos e alertas do Grafana).
# Use junto com o arquivo principal; os caminhos relativos valem a partir de docker/:
#   docker compose -f docker/compose.yml -f docker/rotinas/compose.rotinas.yml up --build
#
# - SMTP: em desenvolvimento, o Mailpit (servico "correio", rede saida), sem senha e sem STARTTLS. Em piloto e
#   producao: SMTP_HOST, porta 587 com STARTTLS, SMTP_USERNAME e SMTP_PASSWORD_FILE=/run/secrets/smtp.
# - Webhooks: assinados pelo Standard Webhooks com o segredo "webhook_assinatura" (base64, 24 a 64 bytes).
# - Grafana -> rotinas: ponto de contato "Webhook" do Grafana com
#     URL                   https://rotinas:9444/interno/alertas-grafana
#     Authorization header  Bearer <conteudo do segredo grafana_webhook>   (ou Basic com usuario qualquer)
#     TLS                   autoridade ca_interna.pem e certificado de cliente grafana_cliente (mTLS)
#   O formato aceito esta documentado em src/mcp_claro/avisos/grafana.py.
# - As rotinas chamam o despachante (POST /interno/declaracoes) com o certificado delas; o despachante precisa
#   aceitar esse certificado de cliente (ver o relatorio da Fase 1).
services:
  rotinas:
    environment:
      DISPATCHER_INTERNAL_URL: https://despachante:9443
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_assinatura
      GRAFANA_WEBHOOK_PASSWORD_FILE: /run/secrets/grafana_webhook
      NOTIFY_ADMIN_EMAILS: admin@mcp-claro.localhost
      NOTIFY_RETRY_MAX: "5"
      CLOSING_INTERVAL_HOURS: "6"
    secrets:
      - db_rotinas
      - ca_interna.pem
      - rotinas_cert.pem
      - rotinas_key.pem
      - webhook_assinatura
      - grafana_webhook
    depends_on:
      despachante:
        condition: service_healthy
      correio:
        condition: service_started
    networks: [interna, saida]

secrets:
  webhook_assinatura: { file: ../.segredos/webhook_assinatura }
  grafana_webhook: { file: ../.segredos/grafana_webhook }
