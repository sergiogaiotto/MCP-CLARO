# pgBackRest 2.60.1 no lado do banco do MCP-CLARO.
#
# - archive_command (com-tls.sh): "pgbackrest --stanza=mcp-claro archive-push %p" manda cada WAL ao
#   repositorio, que fica no conteiner "backup" (repo1-host), pela conexao TLS do pgBackRest.
# - Servidor TLS (porta 8432): o conteiner de backup chega ao banco por ele para as copias e a
#   conferencia. So aceita o certificado de cliente "backup" (tls-server-auth).
# - Certificados: o mesmo do banco (CN=banco, autoridade interna), copiados por preparar-tls.sh.
# - A cifra do repositorio fica so no conteiner de backup; o banco nao guarda a senha dela.
# Opcoes tambem podem vir do ambiente: PGBACKREST_<OPCAO> (por exemplo PGBACKREST_REPO1_HOST).

[global]
repo1-host=backup
repo1-host-type=tls
repo1-host-port=8432
repo1-host-ca-file=/var/lib/postgresql/tls/ca.pem
repo1-host-cert-file=/var/lib/postgresql/tls/cert.pem
repo1-host-key-file=/var/lib/postgresql/tls/key.pem

# WAL em segundo plano, com fila limitada: se o backup ficar fora do ar, o banco nao enche o disco.
# Passando de archive-push-queue-max, o WAL mais velho e descartado e a recuperacao para um ponto no
# tempo fica com um buraco ate a proxima copia completa (o conteiner de backup avisa no "check").
archive-async=y
archive-push-queue-max=4GiB
spool-path=/var/lib/postgresql/pgbackrest/spool
compress-type=zst
process-max=2

log-level-console=warn
log-level-stderr=warn
log-level-file=off
lock-path=/tmp/pgbackrest

tls-server-address=*
tls-server-port=8432
tls-server-ca-file=/var/lib/postgresql/tls/ca.pem
tls-server-cert-file=/var/lib/postgresql/tls/cert.pem
tls-server-key-file=/var/lib/postgresql/tls/key.pem
tls-server-auth=backup=mcp-claro

[mcp-claro]
pg1-path=/var/lib/postgresql/18/docker
pg1-port=5432
pg1-socket-path=/var/run/postgresql
pg1-user=mcp_claro_migracao
