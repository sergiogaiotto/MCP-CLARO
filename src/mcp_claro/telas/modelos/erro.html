{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<h1>{{ titulo }}</h1>
<div class="cartao recusa" role="alert">
  <p>{{ mensagem }}</p>

{% endblock %}
